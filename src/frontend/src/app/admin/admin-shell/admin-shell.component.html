<mat-toolbar color="primary">
  <button mat-icon-button (click)="toggleSidenav()">
    <mat-icon>{{ collapsed() ? 'menu' : 'menu_open' }}</mat-icon>
  </button>
  <span>Admin Configuration</span>
</mat-toolbar>

<mat-sidenav-container style="height: calc(100vh - 128px)">
  <mat-sidenav mode="side" opened [style.width]="collapsed() ? '56px' : '200px'">
    <mat-nav-list>
      @for (item of visibleNavItems(); track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          @if (!collapsed()) {
            <span matListItemTitle>{{ item.label }}</span>
          }
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div style="padding: 24px; overflow-y: auto; height: 100%;">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
