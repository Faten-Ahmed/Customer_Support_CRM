<div class="p-6">
  <h1 class="text-2xl font-semibold mb-4" i18n="@@reports.sla.title">SLA Compliance Report</h1>

  <form [formGroup]="filterForm" class="flex gap-3 mb-6 items-end flex-wrap">
    <mat-form-field appearance="outline">
      <mat-label i18n="@@reports.filter.from">From</mat-label>
      <input matInput type="date" formControlName="dateFrom" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label i18n="@@reports.filter.to">To</mat-label>
      <input matInput type="date" formControlName="dateTo" />
    </mat-form-field>
    <button mat-raised-button color="primary" type="button" (click)="applyFilter()" i18n="@@reports.filter.apply">Apply</button>
    <button mat-stroked-button type="button">
      <mat-icon>download</mat-icon>
      <span i18n="@@reports.filter.export">Export</span>
    </button>
  </form>

  @if (loading()) {
    <div class="h-24 bg-gray-200 rounded animate-pulse mb-4"></div>
  } @else if (error()) {
    <div class="text-center py-12">
      <p class="mb-4" i18n="@@reports.error.message">Failed to load report. Please try again.</p>
      <button mat-raised-button color="primary" (click)="load()" i18n="@@reports.error.retry">Retry</button>
    </div>
  } @else if (report()) {
    <mat-card class="p-4 mb-6 text-center">
      <p class="text-3xl font-bold">{{ report()!.complianceRate }}%</p>
      <p class="text-sm" i18n="@@reports.sla.complianceRate">Overall Compliance Rate</p>
    </mat-card>

    <h2 class="text-lg font-semibold mb-3" i18n="@@reports.sla.byPriority">By Priority</h2>
    <mat-table [dataSource]="report()!.byPriority" class="w-full mb-6">
      <ng-container matColumnDef="priority">
        <mat-header-cell *matHeaderCellDef i18n="@@reports.sla.priority">Priority</mat-header-cell>
        <mat-cell *matCellDef="let r">{{ r.priority }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="compliant">
        <mat-header-cell *matHeaderCellDef i18n="@@reports.sla.compliant">Compliant</mat-header-cell>
        <mat-cell *matCellDef="let r">{{ r.compliant }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="breached">
        <mat-header-cell *matHeaderCellDef i18n="@@reports.sla.breached">Breached</mat-header-cell>
        <mat-cell *matCellDef="let r">{{ r.breached }}</mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="byPriorityColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: byPriorityColumns;"></mat-row>
    </mat-table>
  }
</div>
