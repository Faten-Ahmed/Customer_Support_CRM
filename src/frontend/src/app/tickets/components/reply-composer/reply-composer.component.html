<div class="composer" [class.composer-internal]="isInternal()">

  <!-- Mode selector -->
  <div class="mode-row">
    <label class="mode-option" [class.active]="!isInternal()" (click)="setMode(false)">
      <input type="radio" name="replyMode" [checked]="!isInternal()" (change)="setMode(false)" />
      <span class="mode-icon">💬</span>
      <span class="mode-label">Reply to Customer</span>
    </label>
    <label class="mode-option mode-internal-opt" [class.active]="isInternal()" (click)="setMode(true)">
      <input type="radio" name="replyMode" [checked]="isInternal()" (change)="setMode(true)" />
      <span class="mode-icon">🔒</span>
      <span class="mode-label">Internal Note</span>
    </label>
  </div>

  @if (isInternal()) {
    <div class="internal-banner">Internal notes are only visible to agents — the customer cannot see this.</div>
  }

  <mat-form-field appearance="outline" style="width:100%">
    <mat-label>{{ isInternal() ? 'Internal note…' : 'Write a reply…' }}</mat-label>
    <textarea matInput [formControl]="replyControl" rows="4"></textarea>
  </mat-form-field>

  <div class="composer-footer">
    <div class="footer-left">
      <button mat-stroked-button type="button" (click)="openTemplatePicker()" [disabled]="isInternal()">
        <mat-icon>library_books</mat-icon> Template
      </button>
      <span class="char-count">{{ charCount }} chars</span>
    </div>
    <button mat-flat-button [color]="isInternal() ? 'accent' : 'primary'"
            [disabled]="!replyControl.value?.trim() || sending()"
            (click)="send()">
      {{ sending() ? 'Sending…' : (isInternal() ? 'Add Note' : 'Send Reply') }}
    </button>
  </div>

</div>
