<!-- Top progress bar -->
@if (loading()) {
  <mat-progress-bar mode="indeterminate" color="accent" class="progress-bar"></mat-progress-bar>
}

<!-- Top toolbar -->
<mat-toolbar color="primary">
  <button mat-icon-button (click)="toggleSidenav()" [matTooltip]="collapsed() ? ('shell.expandSidebar' | translate) : ('shell.collapseSidebar' | translate)">
    <mat-icon>{{ collapsed() ? 'menu' : 'menu_open' }}</mat-icon>
  </button>

  <span class="toolbar-brand">{{ 'shell.brand' | translate }}</span>

  <button mat-button (click)="i18n.toggleLang()" [matTooltip]="'shell.switchLang' | translate" class="lang-toggle">
    {{ i18n.lang() === 'en' ? 'ع' : 'EN' }}
  </button>

  <button mat-icon-button (click)="toggleAi()" [matTooltip]="'shell.aiAssistant' | translate">
    <mat-icon>auto_awesome</mat-icon>
  </button>

  <app-notification-bell />

  <button mat-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
    <span>{{ user?.fullName }}</span>
    <span class="role-badge">{{ user?.role }}</span>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item routerLink="/app/profile"><mat-icon>person</mat-icon> {{ 'shell.myProfile' | translate }}</button>
    <button mat-menu-item routerLink="/app/settings"><mat-icon>settings</mat-icon> {{ 'shell.settings' | translate }}</button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> {{ 'shell.logout' | translate }}</button>
  </mat-menu>
</mat-toolbar>

<!-- Sidenav + content -->
<mat-sidenav-container>
  <mat-sidenav mode="side" opened [style.width]="collapsed() ? '56px' : '220px'">
    <nav class="sidenav-nav">
      @for (item of visibleNavItems(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active-link"
           class="nav-link"
           [matTooltip]="collapsed() ? (item.labelKey | translate) : ''" matTooltipPosition="right">
          <mat-icon>{{ item.icon }}</mat-icon>
          @if (!collapsed()) {
            <span>{{ item.labelKey | translate }}</span>
          }
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content-wrap">
      <div class="main-content">
        <router-outlet></router-outlet>
      </div>

      @if (aiOpen()) {
        <div class="ai-panel">
          <app-agent-ai-assistant></app-agent-ai-assistant>
        </div>
      }
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
